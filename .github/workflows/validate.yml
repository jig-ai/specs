name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          for f in specs/*/spec.yaml; do
            npx --yes ajv-cli validate -s schema/spec.v0.json -d "$f"
          done

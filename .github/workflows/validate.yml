name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate specs
        shell: bash
        run: |
          shopt -s nullglob
          specs=(specs/*/spec.yaml)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No specs yet. Nothing to validate."
            exit 0
          fi
          if [ ! -f schema/spec.v0.json ]; then
            echo "::error::schema/spec.v0.json is missing"
            exit 1
          fi
          for f in "${specs[@]}"; do
            echo "Validating $f"
            npx --yes ajv-cli validate -s schema/spec.v0.json -d "$f"
          done
